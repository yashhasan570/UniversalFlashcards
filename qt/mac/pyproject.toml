[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universalflashcards-mac-helper"
version = "0.1.1"
description = "Small support library for Universal Flashcards on Macs"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "Universal Flashcards Team" },
]
urls = { Homepage = "https://github.com/yashhasan570/UniversalFlashcards" }

[tool.hatch.build.targets.wheel]
packages = ["anki_mac_helper"]
