[project]
requires-python = ">=3.10"

# This project was generated with 0.3.26 using template: https://github.com/beeware/briefcase-template @ v0.3.26
[tool.briefcase]
project_name = "Universal Flashcards"
bundle = "net.universalflashcardsweb"
url = "https://apps.ankiweb.net"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
author = "Damien Elmes"
env_manager = "uv"

[tool.briefcase.app.universalflashcards]
formal_name = "Universal Flashcards"
description = "An intelligent spaced-repetition learning system"
long_description = """Universal Flashcards is a flashcard program that helps you spend more time on challenging material, and less on what you already know."""
sources = [
  "src/universalflashcards",
]
icon = "resources/universalflashcards"
cleanup_paths = [
  # document_type icons
  "universalflashcards-*.ico",
  "**/universalflashcards-*.icns",
  # Qt WebEngine debug-symbol resources
  "**/*.debug.pak",
  "**/*.debug.bin",
  # Type-checker stubs / markers
  "**/*.pyi",
  "**/py.typed",
  # PyQt6 binding sources / API completion files
  "**/*.sip",
  "**/PyQt6/bindings/**/*.toml",
  "**/PyQt6/Qt6/qsci",
  # pywin32 dev/help bundles
  "**/PyWin32.chm",
  "**/pythonwin",
  "**/adodbapi",
  "**/isapi",
  "**/win32com/HTML",
  "**/win32com/demos",
  "**/win32com/makegw",
  "**/win32com/include",
  "**/win32com/libs",
  "**/win32com/readme.html",
  # Vendored test suites
  "**/test",
  "**/tests",
  # Packaging metadata
  "**/*.dist-info/INSTALLER",
  "**/*.dist-info/RECORD",
  "**/*.dist-info/WHEEL",
  # Console scripts
  "**/app_packages/bin/*",
]
console_app = false
use_full_install_path = false

permission.microphone = "The microphone will only be used when you tap the record button."
permission.camera = "Add-ons may access your camera."

[tool.briefcase.app.universalflashcards.macOS]
universal_build = false
min_os_version = "13.0"
entitlement."com.apple.security.cs.allow-jit" = true
entitlement."com.apple.security.cs.disable-executable-page-protection" = true
entitlement."com.apple.security.cs.allow-dyld-environment-variables" = true
entitlement."com.apple.security.device.audio-input" = true
support_revision = "18"
stub_binary_revision = "17"

[tool.briefcase.app.universalflashcards.linux]
support_revision = "3.13.18+20261026"

[tool.briefcase.app.universalflashcards.linux.flatpak]
supported = false

[tool.briefcase.app.universalflashcards.windows]
create_desktop_shortcut = true
min_os_version = "17763"
support_revision = "17"
stub_binary_revision = "13"

[tool.briefcase.app.universalflashcards.iOS]
supported = false

[tool.briefcase.app.universalflashcards.android]
supported = false

[tool.briefcase.app.universalflashcards.web]
supported = false

[tool.briefcase.app.universalflashcards.document_type.apkg]
description = "Universal Flashcards deck package"
extension = "apkg"
icon = "resources/universalflashcards"
mime_type = "application/x-apkg"
url = "https://docs.ankiweb.net/manual/exporting#deck-apkg"
macOS.CFBundleTypeRole = "Editor"

[tool.briefcase.app.universalflashcards.document_type.colpkg]
description = "Universal Flashcards collection package"
extension = "colpkg"
icon = "resources/universalflashcards"
mime_type = "application/x-colpkg"
url = "https://docs.ankiweb.net/manual/exporting#collection-colpkg"
macOS.CFBundleTypeRole = "Editor"

[tool.briefcase.app.universalflashcards.document_type.universalflashcardsaddon]
description = "Universal Flashcards add-on package"
extension = "universalflashcardsaddon"
icon = "resources/universalflashcards"
mime_type = "application/x-universalflashcardsaddon"
url = "https://docs.ankiweb.net/addons/sharing"
macOS.CFBundleTypeRole = "Editor"
