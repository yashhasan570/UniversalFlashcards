nodeLinker: node-modules
enableScripts: false

# Release-age gate (requires Yarn >= 4.11). Match pyproject uv exclude-newer / Dependabot cooldown (~7d).
# https://yarnpkg.com/configuration/yarnrc#npmminimalagegate
# https://github.com/yashhasan570/UniversalFlashcards/issues/4747
npmMinimalAgeGate: "7d"
