[package]
name = "rsbridge"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
description = "Universal Flashcards's Rust library code Python bindings"

[lib]
name = "rsbridge"
crate-type = ["cdylib"]
path = "lib.rs"
test = false

[dependencies]
universalflashcards.workspace = true
pyo3.workspace = true

[features]
rustls = ["universalflashcards/rustls"]
native-tls = ["universalflashcards/native-tls"]
